<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content ="width=device-width, initial-scale=1.0" />
    <meta name="Author" content="Mayank Garg" />
    <title>GRID BOX</title>
    <link rel="stylesheet" href="" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    display:grid;

    height:100vh;

    grid-template-rows:10vh 1fr 10vh;

    font-family:Arial, Helvetica, sans-serif;

}
.box{
    background:darkred;
    color:white;
    padding:1rem;
    border:2px solid white;
    text-align:center;
}
header{
    display:grid;
    place-items:center;
}
.gc{

    display:grid;
    gap:10px;
    background:white;
    padding:10px;
    grid-template-columns:150px 250px;
    grid-template-rows:repeat(3,150px);
    place-content:center;
}
footer{
    display:grid;
    place-items:center;
}
@media (min-width:768px){
.gc{

    grid-template-columns:repeat(4,150px);
    grid-template-rows:repeat(4,120px);

}

#m1{
    grid-column:1/-1;
}

#m2{
    grid-column:1/3;
    grid-row:2/4;
}
#m3{
    grid-column:3/-1;
}
#m4{
    grid-column:3/-1;
    grid-row:3/4;
}
#m5{
    grid-column:1/2;
}
#m6{
    grid-column:2/-1;
}
}
</style>
</head>
<body>

<header class="box">
    ♔ Header / Navbar
</header>

<main class="gc">

    <div class="box" id="m1">Content-1</div>
    <div class="box" id="m2">Content-2</div>
    <div class="box" id="m3">Content-3</div>
    <div class="box" id="m4">Content-4</div>
    <div class="box" id="m5">Content-5</div>
    <div class="box" id="m6">Content-6</div>
</main>
<footer class="box">
    ☰ Footer
</footer>
</body>
</html>
